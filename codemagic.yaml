workflows:
  ios-release:
    name: K-Waiter 3 iOS Release

    max_build_duration: 120

    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic K-Waiter

    environment:
      xcode: latest
      cocoapods: default
      node: 22

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.microsolution.kwaiter3

      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build Vue web application
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
