workflows:
  ios-release:
    name: K-Waiter 3 iOS Release

    max_build_duration: 120

    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      node: 22

      ios_signing:
        provisioning_profiles:
          - K_WAITER_APP_STORE
        certificates:
          - K-Waiter Apple Distribution

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build Vue web application
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
